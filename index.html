<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株式市場カウントダウン</title>
  <meta name="description" content="東京・NY市場の寄り・引けを将棋の秒読みでカウントダウン">
  <meta name="theme-color" content="#0f0f0f">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BQFNVMDLYM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BQFNVMDLYM');
  </script>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="市場カウントダウン">
  <style>
    :root {
      --bg: #0f0f0f; --bg2: #1a1a1a; --bg3: #242424;
      --border: rgba(255,255,255,0.08); --text: #f0f0f0;
      --muted: #888; --hint: #555; --accent: #e8e8e8;
      --red: #e24b4a; --amber: #d4930a; --green: #1d9e75;
      --font-mono: 'SF Mono','Fira Code','Consolas',monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif; }
    body { display: flex; flex-direction: column; min-height: 100dvh; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 12px; border-bottom: 0.5px solid var(--border); }
    .header-title { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
    .header-time { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
    .tabs { display: flex; gap: 6px; padding: 12px 20px; border-bottom: 0.5px solid var(--border); }
    .tab { flex: 1; padding: 9px 0; border: 0.5px solid var(--border); border-radius: 8px; background: transparent; cursor: pointer; font-size: 13px; color: var(--muted); transition: all 0.15s; font-family: inherit; }
    .tab.active { background: var(--bg3); color: var(--text); border-color: rgba(255,255,255,0.2); }
    .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px; }
    .event-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .event-name { font-size: 18px; font-weight: 600; margin-bottom: 28px; }
    .countdown-wrap { position: relative; margin-bottom: 20px; }
    .countdown { font-family: var(--font-mono); font-size: clamp(56px,16vw,96px); font-weight: 400; letter-spacing: 0.05em; color: var(--accent); transition: color 0.25s; line-height: 1; }
    .countdown.warning { color: var(--amber); }
    .countdown.urgent { color: var(--red); }
    .sekiyomi { min-height: 52px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    .sekiyomi-num { font-family: var(--font-mono); font-size: 40px; font-weight: 600; color: var(--red); animation: pulse 0.4s ease-out; }
    @keyframes pulse { 0% { transform: scale(1.3); opacity: 0.6; } 100% { transform: scale(1); opacity: 1; } }
    .status-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--hint); }
    .dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot.soon { background: var(--amber); }
    .dot.urgent-dot { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .status-text { font-size: 12px; color: var(--muted); }
    .sessions { padding: 0 20px 20px; display: flex; flex-direction: column; gap: 8px; }
    .session-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0.5px solid var(--border); border-radius: 10px; background: var(--bg2); }
    .session-card.next { border-color: rgba(255,255,255,0.2); background: var(--bg3); }
    .session-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--hint); }
    .session-dot.open { background: var(--green); }
    .session-dot.soon { background: var(--amber); }
    .session-dot.next { background: var(--red); }
    .session-info { flex: 1; }
    .session-name { font-size: 13px; font-weight: 500; }
    .session-time { font-size: 11px; color: var(--muted); font-family: var(--font-mono); margin-top: 2px; }
    .session-remain { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
    .badge { font-size: 10px; padding: 2px 8px; border-radius: 99px; border: 0.5px solid; }
    .badge-soon { color: var(--amber); border-color: var(--amber); }
    .badge-open { color: var(--green); border-color: var(--green); }
    .badge-done { color: var(--hint); border-color: var(--hint); }
    .footer { padding: 12px 20px 20px; display: flex; align-items: center; justify-content: space-between; border-top: 0.5px solid var(--border); position: relative; }
    .footer-credit { position: absolute; bottom: 4px; right: 12px; font-size: 10px; color: var(--hint); display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-decoration: none; opacity: 0.7; transition: opacity 0.2s; }
    .footer-credit:hover { opacity: 1; }
    .footer-credit-top { display: flex; align-items: center; gap: 4px; }
    .footer-version { font-size: 8px; font-family: var(--font-mono); opacity: 0.6; }
    .footer-logo { width: 14px; height: 14px; border-radius: 50%; opacity: 0.8; vertical-align: middle; }
    .sound-label { font-size: 12px; color: var(--muted); }
    .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .toggle-track { width: 36px; height: 20px; background: var(--bg3); border: 0.5px solid var(--border); border-radius: 10px; position: relative; transition: background 0.2s; }
    .toggle-track.on { background: var(--green); border-color: var(--green); }
    .toggle-knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: var(--text); border-radius: 50%; transition: transform 0.2s; }
    .toggle-track.on .toggle-knob { transform: translateX(16px); }
    .install-btn { display: none; padding: 7px 14px; border: 0.5px solid var(--border); border-radius: 8px; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; font-family: inherit; }
    .install-btn.visible { display: block; }
    .test-bar { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 20px; background: rgba(212,147,10,0.12); border-bottom: 0.5px solid rgba(212,147,10,0.3); flex-wrap: wrap; }
    .test-bar.hidden { display: none; }
    .test-label { font-size: 11px; color: var(--amber); font-weight: 500; }
    .test-btn { padding: 5px 14px; border: 0.5px solid var(--amber); border-radius: 6px; background: transparent; color: var(--amber); font-size: 12px; cursor: pointer; font-family: inherit; }
    .test-btn.active { background: var(--amber); color: #000; font-weight: 600; }

    /* ==== フィードバック (Issue #3 PoC) ==== */
    .feedback-btn { padding: 7px 14px; border: 0.5px solid var(--border); border-radius: 8px; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; font-family: inherit; }
    .feedback-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .feedback-overlay.hidden { display: none; }
    .feedback-modal { width: 100%; max-width: 360px; max-height: 90vh; overflow-y: auto; background: var(--bg2); border: 0.5px solid var(--border); border-radius: 14px; padding: 18px; }
    .feedback-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .feedback-title { font-size: 15px; font-weight: 600; }
    .feedback-close { background: transparent; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 4px; }
    .feedback-type-row { display: flex; gap: 6px; margin-bottom: 12px; }
    .feedback-type-btn { flex: 1; padding: 9px 0; border: 0.5px solid var(--border); border-radius: 8px; background: transparent; cursor: pointer; font-size: 12px; color: var(--muted); font-family: inherit; }
    .feedback-type-btn.active { background: var(--bg3); color: var(--text); border-color: rgba(255,255,255,0.2); }
    .feedback-textarea { width: 100%; min-height: 96px; background: var(--bg3); border: 0.5px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px; font-family: inherit; font-size: 13px; resize: vertical; margin-bottom: 10px; }
    .feedback-env { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
    .feedback-env summary { cursor: pointer; }
    .feedback-env-preview { font-family: var(--font-mono); font-size: 10px; white-space: pre-wrap; word-break: break-all; background: var(--bg3); padding: 8px; border-radius: 6px; max-height: 140px; overflow-y: auto; margin-top: 6px; }
    .feedback-submit { width: 100%; padding: 10px 0; border: 0.5px solid var(--amber); border-radius: 8px; background: transparent; color: var(--amber); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .feedback-submit:disabled { opacity: 0.5; cursor: default; }
    .feedback-status { font-size: 12px; margin-top: 10px; min-height: 16px; }
    .feedback-status.success { color: var(--green); }
    .feedback-status.error { color: var(--red); }
  </style>
</head>
<body>
<div class="header">
  <div class="header-title" id="header-title">株式市場カウントダウン</div>
  <div class="header-time" id="clock">--:--:--</div>
</div>
<div class="tabs">
  <button class="tab active" id="tab-tse" onclick="setMarket('tse')">東京証券取引所</button>
  <button class="tab" id="tab-us" onclick="setMarket('us')">NYSE / NASDAQ</button>
</div>
<div class="test-bar hidden" id="test-bar">
  <div class="test-label">TEST</div>
  <input type="date" id="test-date" onchange="onTestDateChange(this.value)"
    style="background:#2a2000;border:0.5px solid var(--amber);border-radius:6px;color:var(--amber);font-size:12px;padding:4px 8px;font-family:inherit;cursor:pointer;min-width:130px;color-scheme:dark;">
  <div id="test-session-btns" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;"></div>
  <div id="test-lead-btns" style="display:flex;gap:4px;align-items:center;">
    <span class="test-label" style="font-size:10px;">開始:</span>
    <button class="test-btn active" id="lead-12" onclick="setTestLeadSec(12)" style="font-size:10px;padding:2px 6px;">12秒前</button>
    <button class="test-btn" id="lead-30" onclick="setTestLeadSec(30)" style="font-size:10px;padding:2px 6px;">30秒前</button>
    <button class="test-btn" id="lead-60" onclick="setTestLeadSec(60)" style="font-size:10px;padding:2px 6px;">1分前</button>
    <button class="test-btn" id="lead-180" onclick="setTestLeadSec(180)" style="font-size:10px;padding:2px 6px;">3分前</button>
    <button class="test-btn" id="lead-315" onclick="setTestLeadSec(315)" style="font-size:10px;padding:2px 6px;">5分15秒前</button>
  </div>
  <div class="test-label" id="test-count"></div>
  <button class="test-btn" onclick="hideTestBar()" style="font-size:11px;padding:3px 10px;">画面隠す</button>
  <button class="test-btn" onclick="toggleTest()" style="font-size:11px;padding:3px 10px;">終了</button>
</div>
<div id="trigger-test" style="position:fixed;top:0;right:0;width:48px;height:48px;z-index:9999;display:flex;align-items:flex-start;justify-content:flex-end;padding:6px;">
  <div style="width:6px;height:6px;border-radius:50%;background:var(--amber);opacity:0.45;"></div>
</div>
<div id="trigger-log" style="position:fixed;top:0;left:0;width:48px;height:48px;z-index:9999;display:flex;align-items:flex-start;justify-content:flex-start;padding:6px;">
  <div style="width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:0.45;"></div>
</div>
<div id="test-peek" style="display:none;position:fixed;bottom:12px;right:12px;z-index:999;">
  <button onclick="showTestBar()" style="width:36px;height:36px;border-radius:50%;border:0.5px solid rgba(212,147,10,0.5);background:rgba(212,147,10,0.15);color:#d4930a;font-size:16px;cursor:pointer;font-family:inherit;">T</button>
</div>
<div class="main">
  <div class="event-label">次のイベントまで</div>
  <div class="event-name" id="event-name">読み込み中...</div>
  <div class="countdown-wrap"><div class="countdown" id="countdown">--:--</div></div>
  <div class="sekiyomi" id="sekiyomi-wrap"></div>
  <div class="status-row">
    <div class="dot" id="status-dot"></div>
    <div class="status-text" id="status-text"></div>
  </div>
</div>
<div class="sessions" id="sessions"></div>
<div id="log-panel" style="display:none;padding:0 20px 12px;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
    <div style="font-size:11px;color:var(--hint);">読み上げ履歴</div>
    <button onclick="downloadLog()" style="padding:3px 10px;border:0.5px solid var(--border);border-radius:6px;background:transparent;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;">↓ ダウンロード</button>
  </div>
  <div id="log-list" style="font-family:var(--font-mono);font-size:11px;color:var(--muted);max-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;"></div>
</div>
<div class="footer">
  <div class="toggle" onclick="toggleSound()">
    <div class="toggle-track on" id="sound-track"><div class="toggle-knob"></div></div>
    <div class="sound-label">秒読み音声</div>
  </div>
  <button class="install-btn" id="install-btn" onclick="installPWA()">ホーム画面に追加</button>
  <a href="https://www.marunwonderland.com/" class="footer-credit" target="_blank" rel="noopener noreferrer">
    <div class="footer-credit-top">
      <img src="icons/marunwonderland_logo.png" class="footer-logo" alt="marunwonderland logo">
      <span>powered by marunwonderland</span>
    </div>
    <div class="footer-version" id="footer-version"></div>
  </a>
</div>

<div class="feedback-overlay hidden" id="feedback-overlay">
  <div class="feedback-modal">
    <div class="feedback-header">
      <div class="feedback-title">フィードバック</div>
      <button class="feedback-close" onclick="closeFeedbackModal()" aria-label="閉じる">✕</button>
    </div>
    <div class="feedback-type-row">
      <button class="feedback-type-btn active" id="feedback-type-problem" onclick="selectFeedbackType('problem')">問題を報告</button>
      <button class="feedback-type-btn" id="feedback-type-suggestion" onclick="selectFeedbackType('suggestion')">機能を提案</button>
    </div>
    <textarea id="feedback-message" class="feedback-textarea" placeholder="内容を入力してください" maxlength="5000"></textarea>
    <details class="feedback-env">
      <summary>送信される情報を確認</summary>
      <pre class="feedback-env-preview" id="feedback-env-preview"></pre>
    </details>
    <button class="feedback-submit" id="feedback-submit" onclick="submitFeedback()">送信</button>
    <div class="feedback-status" id="feedback-status"></div>
  </div>
</div>

<script>
const APP_VERSION = '1.0.0';
console.log('[VERSION] ' + APP_VERSION);

function updateDisplayVersion() {
  const displayVer = window._androidAppVersion || APP_VERSION;
  document.getElementById('footer-version').textContent = 'v' + displayVer;
}
updateDisplayVersion();

// Androidからの通知を待機
const verCheckInterval = setInterval(() => {
  if (window._androidAppVersion) {
    updateDisplayVersion();
    clearInterval(verCheckInterval);
  }
}, 500);
setTimeout(() => clearInterval(verCheckInterval), 5000);

// --- 休場日データ（isHolidayを最初に定義）---
const JPX_HOLIDAYS = new Set([
  '2025-01-01','2025-01-02','2025-01-03','2025-01-13','2025-02-11','2025-02-23','2025-02-24',
  '2025-03-20','2025-04-29','2025-05-03','2025-05-04','2025-05-05','2025-05-06',
  '2025-07-21','2025-08-11','2025-09-15','2025-09-22','2025-09-23',
  '2025-10-13','2025-11-03','2025-11-23','2025-11-24','2025-12-31',
  '2026-01-01','2026-01-02','2026-01-03','2026-01-12','2026-02-11','2026-02-23',
  '2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06',
  '2026-07-20','2026-08-11','2026-09-21','2026-09-22','2026-09-23',
  '2026-10-12','2026-11-03','2026-11-23','2026-12-31',
  '2027-01-01','2027-01-02','2027-01-03','2027-01-11','2027-02-11','2027-02-23',
  '2027-03-22','2027-04-29','2027-05-03','2027-05-04','2027-05-05',
  '2027-07-19','2027-08-11','2027-09-20','2027-09-23',
  '2027-10-11','2027-11-03','2027-11-23','2027-12-31',
]);
const NYSE_HOLIDAYS = new Set([
  '2025-01-01','2025-01-20','2025-02-17','2025-04-18','2025-05-26','2025-06-19','2025-07-04','2025-09-01','2025-11-27','2025-12-25',
  '2026-01-01','2026-01-19','2026-02-16','2026-04-03','2026-05-25','2026-06-19','2026-07-03','2026-09-07','2026-11-26','2026-12-25',
  '2027-01-01','2027-01-18','2027-02-15','2027-03-26','2027-05-31','2027-06-18','2027-07-05','2027-09-06','2027-11-25','2027-12-24',
]);
function isHoliday(mk, dateObj) {
  const dow = dateObj.getDay();
  if (dow === 0 || dow === 6) return true;
  const key = `${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}-${String(dateObj.getDate()).padStart(2,'0')}`;
  return mk === 'tse' ? JPX_HOLIDAYS.has(key) : NYSE_HOLIDAYS.has(key);
}

// --- マーケット定義 ---
const MARKETS = {
  tse: {
    tz: 'Asia/Tokyo', label: 'JST',
    sessions: [
      { name: '前場 寄り',  h: 9,  m: 0,  type: 'open',  announce10: 'ぜんばよりまで10秒前',      announce0: 'マーケットがオープンしました' },
      { name: '前場 引け',  h: 11, m: 30, type: 'close', announce10: 'ぜんばひけまで10秒前',      announce0: 'ぜんばクローズです' },
      { name: '後場 寄り',  h: 12, m: 30, type: 'open',  announce10: 'ごばよりまで10秒前',        announce0: 'ごばオープンです' },
      { name: '後場 引け',  h: 15, m: 30, type: 'close', announce10: 'ごばひけまで10秒前',        announce0: 'マーケットがクローズしました' },
    ]
  },
  us: {
    tz: 'America/New_York', label: 'ET',
    sessions: [
      { name: 'プレマーケット開始', h: 4,  m: 0,  type: 'open',  announce10: 'プレマーケット開始まで10秒前', announce0: 'プレマーケットが始まりました' },
      { name: '寄り (Open)',        h: 9,  m: 30, type: 'open',  announce10: '寄りまで10秒前',              announce0: 'マーケットがオープンしました' },
      { name: '引け (Close)',       h: 16, m: 0,  type: 'close', announce10: '引けまで10秒前',              announce0: 'マーケットがクローズしました' },
      { name: 'アフターアワー終了', h: 20, m: 0,  type: 'close', announce10: 'アフターアワー終了まで10秒前', announce0: 'アフターアワーが終了しました' },
    ]
  }
};

// --- 状態変数 ---
let market = 'tse', soundOn = true, lastSpoken = -1;

// 音声設定の永続化（ページ読み込み時）
const savedSoundOn = localStorage.getItem('soundOn');
if (savedSoundOn !== null) {
  soundOn = savedSoundOn === 'true';
}
document.getElementById('sound-track').className = 'toggle-track' + (soundOn?' on':'');
let audioCtx = null, deferredPrompt = null, firedDate = '', speakLog = [];
let testMode = false, testSessionIndex = 0, fakeNowSec = null, fakeDateStr = null, testRunId = 0;
let scheduledOscillators = [], scheduledSpeechTimers = [], scheduledEventKey = null;

// --- バージョンチェック（キャッシュクリア）---
const storedVersion = localStorage.getItem('appVersion');
if (storedVersion !== APP_VERSION) {
  console.log('[VERSION] New version detected, clearing caches...');
  if ('caches' in window) {
    caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
  }
  localStorage.setItem('appVersion', APP_VERSION);
}

// --- ユーティリティ ---
function resetFiredFlags() {
  Object.values(MARKETS).forEach(m => m.sessions.forEach(s => { s.fired = false; }));
}

function nowInTZ(tz) {
  const base = new Date(new Date().toLocaleString('en-US', { timeZone: tz }));
  if (fakeDateStr) {
    const [y, m, d] = fakeDateStr.split('-').map(Number);
    base.setFullYear(y); base.setMonth(m - 1); base.setDate(d);
  }
  if (fakeNowSec !== null) {
    base.setHours(Math.floor(fakeNowSec / 3600));
    base.setMinutes(Math.floor((fakeNowSec % 3600) / 60));
    base.setSeconds(fakeNowSec % 60);
  }
  return base;
}

function fmt(sec) {
  if (sec < 0) sec = 0;
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function nextOpenDay(marketKey) {
  const cfg = MARKETS[marketKey];
  const base = new Date(new Date().toLocaleString('en-US', { timeZone: cfg.tz }));
  for (let i = 0; i < 30; i++) {
    const check = new Date(base);
    check.setDate(base.getDate() + i);
    if (!isHoliday(marketKey, check)) return check;
  }
  return base;
}

// --- 音声 & スケジューラ ---
function getAudioContext() {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  } catch(e) {
    return null;
  }
}

function scheduleBeep(when, freq, dur) {
  try {
    const ctx = getAudioContext();
    if (!ctx) return null;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.connect(g);
    g.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, when);
    g.gain.setValueAtTime(0.18, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    osc.start(when);
    osc.stop(when + dur);
    return osc;
  } catch(e) {
    return null;
  }
}

function beep(freq, dur, when) {
  const ctx = getAudioContext();
  if (!ctx) return null;
  const t = (when !== undefined && when !== null) ? when : ctx.currentTime;
  return scheduleBeep(t, freq, dur);
}

function speak(text) {
  if (!soundOn || !text) return;
  addLog(text);
  console.log('[speak] ' + text + ' AndroidTTS=' + !!window.AndroidTTS);
  try {
    if (window.AndroidTTS) { window.AndroidTTS.speak(String(text)); return; }
  } catch(e) {}
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'ja-JP'; u.rate = 1.1;
    window.speechSynthesis.speak(u);
  } catch(e) {}
}

function cancelScheduledAudio() {
  for (const osc of scheduledOscillators) {
    try { osc.stop(); osc.disconnect(); } catch(e) {}
  }
  scheduledOscillators = [];

  for (const tid of scheduledSpeechTimers) {
    clearTimeout(tid);
  }
  scheduledSpeechTimers = [];
  scheduledEventKey = null;
}

function getNextSessionInfo(mk) {
  const cfg = MARKETS[mk];
  const now = nowInTZ(cfg.tz);
  if (isHoliday(mk, now)) return null;

  if (testMode && fakeNowSec !== null) {
    const s = cfg.sessions[testSessionIndex];
    const targetSec = s.h * 3600 + s.m * 60;
    const diff = targetSec - fakeNowSec;
    return { session: s, index: testSessionIndex, diff, targetSec, nowSec: fakeNowSec };
  }

  const sec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  let next = null, minDiff = Infinity, nextIdx = -1;
  for (let i = 0; i < cfg.sessions.length; i++) {
    const diff = cfg.sessions[i].h * 3600 + cfg.sessions[i].m * 60 - sec;
    if (diff >= 0 && diff < minDiff) {
      minDiff = diff;
      next = cfg.sessions[i];
      nextIdx = i;
    }
  }
  if (!next) {
    for (let i = 0; i < cfg.sessions.length; i++) {
      const diff = cfg.sessions[i].h * 3600 + cfg.sessions[i].m * 60 - sec;
      if (diff < 0 && diff > -3) {
        return { session: cfg.sessions[i], index: i, diff, targetSec: cfg.sessions[i].h * 3600 + cfg.sessions[i].m * 60, nowSec: sec };
      }
    }
    return null;
  }
  return { session: next, index: nextIdx, diff: minDiff, targetSec: next.h * 3600 + next.m * 60, nowSec: sec };
}

function scheduleAudioForNextEvent() {
  if (!soundOn) return;
  const cfg = MARKETS[market];
  const now = nowInTZ(cfg.tz);
  if (isHoliday(market, now)) {
    cancelScheduledAudio();
    return;
  }

  const info = getNextSessionInfo(market);
  if (!info || info.diff < 0) {
    cancelScheduledAudio();
    return;
  }

  const session = info.session;
  const todayStr = fakeDateStr || `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;
  const eventKey = `${market}_${todayStr}_${session.name}_${session.h}:${session.m}_test${testMode ? testRunId : '0'}`;

  if (scheduledEventKey === eventKey) {
    return;
  }

  cancelScheduledAudio();
  scheduledEventKey = eventKey;

  const diff = info.diff;
  const ctx = getAudioContext();
  const baseAudioTime = ctx ? ctx.currentTime : null;

  const sequence = [
    { offset: 11, text: session.announce10, freq: null, dur: null },
    { offset: 10, text: null, freq: 780, dur: 0.2 },
    { offset: 9,  text: '9', freq: 660, dur: 0.12 },
    { offset: 8,  text: '8', freq: 660, dur: 0.12 },
    { offset: 7,  text: '7', freq: 660, dur: 0.12 },
    { offset: 6,  text: '6', freq: 660, dur: 0.12 },
    { offset: 5,  text: '5', freq: 660, dur: 0.12 },
    { offset: 4,  text: '4', freq: 660, dur: 0.12 },
    { offset: 3,  text: '3', freq: 660, dur: 0.12 },
    { offset: 2,  text: '2', freq: 660, dur: 0.12 },
    { offset: 1,  text: '1', freq: 880, dur: 0.12 },
    { offset: 0,  text: session.announce0, freq: 1100, dur: 0.5 }
  ];

  for (const item of sequence) {
    const delaySec = diff - item.offset;
    if (delaySec < -0.3) continue;

    const effectiveDelaySec = Math.max(0, delaySec);

    // Web Audio ビープ音の先行予約
    if (item.freq && ctx && baseAudioTime !== null) {
      const osc = scheduleBeep(baseAudioTime + effectiveDelaySec, item.freq, item.dur);
      if (osc) scheduledOscillators.push(osc);
    }

    // 音声アナウンス / TTSの予約
    if (item.text) {
      const tid = setTimeout(() => {
        if (soundOn && scheduledEventKey === eventKey) {
          speak(item.text);
        }
      }, effectiveDelaySec * 1000);
      scheduledSpeechTimers.push(tid);
    }
  }
}

// タブ復帰（バックグラウンドからの復帰）時の再同期
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    getAudioContext();
    cancelScheduledAudio();
    scheduleAudioForNextEvent();
    update();
  }
});

// ユーザージェスチャーで AudioContext をアンロック
function unlockAudio() {
  getAudioContext();
  scheduleAudioForNextEvent();
}
['click', 'touchstart', 'keydown'].forEach(evt => {
  window.addEventListener(evt, unlockAudio, { passive: true });
});

function addLog(text) {
  const now = new Date();
  const t = now.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
  speakLog.push({ date: now.toLocaleDateString('ja-JP'), time: t, text });
  const list = document.getElementById('log-list');
  if (list) {
    const row = document.createElement('div');
    row.style.cssText = 'padding:4px 8px;background:var(--bg2);border-radius:4px;';
    row.textContent = `${t}  ${text}`;
    list.appendChild(row); list.scrollTop = list.scrollHeight;
  }
}

function downloadLog() {
  if (!speakLog.length) return;
  const blob = new Blob([speakLog.map(e => `${e.date} ${e.time}\t${e.text}`).join('\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `market-bell-log-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
}

window.addEventListener('beforeinstallprompt', e => {

});

// --- マーケット切り替え ---
function setMarket(m) {
  if (market !== m) {
    market = m; lastSpoken = -1;
    cancelScheduledAudio();
    document.getElementById('tab-tse').className = 'tab' + (m==='tse'?' active':'');
    document.getElementById('tab-us').className = 'tab' + (m==='us'?' active':'');
    scheduleAudioForNextEvent();
    update();
  }
}

function toggleSound() {
  soundOn = !soundOn;
  localStorage.setItem('soundOn', String(soundOn));
  document.getElementById('sound-track').className = 'toggle-track' + (soundOn?' on':'');
  if (soundOn) {
    getAudioContext();
    scheduleAudioForNextEvent();
  } else {
    cancelScheduledAudio();
    if (window.speechSynthesis) {
      try { window.speechSynthesis.cancel(); } catch(e) {}
    }
  }
}

// --- テストモード ---
function startTest() {
  testMode = true; testSessionIndex = 0; lastSpoken = -1;
  const next = nextOpenDay(market);
  const y = next.getFullYear(), m = String(next.getMonth()+1).padStart(2,'0'), d = String(next.getDate()).padStart(2,'0');
  fakeDateStr = `${y}-${m}-${d}`;
  document.getElementById('test-date').value = fakeDateStr;
  document.getElementById('test-bar').classList.remove('hidden');
  buildTestButtons();
  selectTestSession(0);
}

function onTestDateChange(val) {
  fakeDateStr = val || null; lastSpoken = -1; resetFiredFlags();
  cancelScheduledAudio();
  const d = fakeDateStr ? new Date(fakeDateStr + 'T12:00:00') : new Date();
  const holiday = isHoliday(market, d);
  document.getElementById('test-session-btns').style.display = 'flex';
  if (holiday) {
    document.getElementById('test-count').textContent = '🔴 休場日';
    update();
  } else {
    selectTestSession(testSessionIndex);
  }
}

function buildTestButtons() {
  const cfg = MARKETS[market], wrap = document.getElementById('test-session-btns');
  wrap.innerHTML = '';
  cfg.sessions.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'test-btn' + (i === 0 ? ' active' : '');
    btn.textContent = s.name; btn.style.fontSize = '11px'; btn.style.padding = '3px 10px';
    btn.onclick = () => selectTestSession(i); wrap.appendChild(btn);
  });
}

let testLeadSec = 12;
function setTestLeadSec(sec) {
  testLeadSec = sec;
  document.querySelectorAll('#test-lead-btns .test-btn').forEach(b => {
    b.classList.toggle('active', b.id === `lead-${sec}`);
  });
  selectTestSession(testSessionIndex);
}

function selectTestSession(i) {
  const cfg = MARKETS[market]; testSessionIndex = i; lastSpoken = -1; testRunId++;
  cfg.sessions[i].fired = false;
  document.querySelectorAll('#test-session-btns .test-btn').forEach((b, j) => b.classList.toggle('active', j === i));
  const s = cfg.sessions[i];
  fakeNowSec = s.h * 3600 + s.m * 60 - testLeadSec;
  document.getElementById('test-count').textContent = s.name;
  cancelScheduledAudio();
  scheduleAudioForNextEvent();
  update();
}

function toggleTest() {
  testMode = false; fakeNowSec = null; fakeDateStr = null; lastSpoken = -1; testLeadSec = 12;
  cancelScheduledAudio();
  document.getElementById('test-bar').classList.add('hidden');
  document.getElementById('test-peek').style.display = 'none';
  document.getElementById('test-count').textContent = '';
  scheduleAudioForNextEvent();
  update();
}
function hideTestBar() { document.getElementById('test-bar').classList.add('hidden'); document.getElementById('test-peek').style.display = 'block'; }
function showTestBar() { document.getElementById('test-bar').classList.remove('hidden'); document.getElementById('test-peek').style.display = 'none'; }

// --- メインループ（UI描画） ---
function update() {
  const cfg = MARKETS[market];
  const now = nowInTZ(cfg.tz);
  const realToday = new Date().toLocaleDateString();
  if (realToday !== firedDate) {
    firedDate = realToday;
    resetFiredFlags();
    lastSpoken = -1;
    cancelScheduledAudio();
  }

  document.getElementById('clock').textContent =
    now.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false})
    + ' ' + cfg.label + (testMode ? ' [TEST]' : '');

  const cd = document.getElementById('countdown');
  const seki = document.getElementById('sekiyomi-wrap');
  const dot = document.getElementById('status-dot');
  const stxt = document.getElementById('status-text');

  // 休場チェック
  if (isHoliday(market, now)) {
    document.getElementById('event-name').textContent = testMode ? '休場日（テスト中）' : '本日休場';
    cd.textContent = '--:--'; cd.className = 'countdown'; seki.innerHTML = '';
    dot.className = 'dot'; stxt.textContent = market === 'tse' ? '東証休業日' : 'NYSE休場日';
    if (!testMode) document.getElementById('sessions').innerHTML = '';
    cancelScheduledAudio();
    return;
  }

  const info = getNextSessionInfo(market);
  if (info) {
    const next = info.session;
    const d = info.diff;
    document.getElementById('event-name').textContent = next.name;
    cd.textContent = fmt(d);
    cd.className = 'countdown' + (d <= 10 && d > 0 ? ' urgent' : d <= 60 ? ' warning' : '');

    // UI上の秒読み・完了表示
    if (d > 0 && d <= 10) {
      seki.innerHTML = `<div class="sekiyomi-num">${d}</div>`;
    } else if (d <= 0 && d >= -3) {
      seki.innerHTML = `<div class="sekiyomi-num" style="color:#f0f0f0">${next.type==='open'?'オープン！':'クローズ！'}</div>`;
    } else {
      seki.innerHTML = '';
    }

    dot.className = 'dot' + (d<=10 && d>0 ? ' urgent-dot' : d<=900 ? ' soon' : ' active');
    stxt.textContent = (d<=10 && d>0) ? '秒読み中' : (d<=0 && d>=-3) ? 'オープン / クローズ' : (d<=900) ? 'まもなく' : '待機中';

    if (!testMode) {
      const list = document.getElementById('sessions');
      list.innerHTML = '';
      const sec = info.nowSec;
      for (const s of cfg.sessions) {
        const diff = s.h*3600 + s.m*60 - sec;
        const isNext = s.h===next.h && s.m===next.m;
        const card = document.createElement('div');
        card.className = 'session-card' + (isNext?' next':'');
        let dotCls = 'session-dot', badge = '<span class="badge badge-done">終了</span>', rem = '--';
        if (diff > 0) {
          dotCls += diff<=900 ? ' soon' : ' open';
          badge = diff<=900 ? '<span class="badge badge-soon">まもなく</span>' : '<span class="badge badge-open">予定</span>';
          rem = fmt(diff);
        }
        if (isNext) dotCls = 'session-dot next';
        card.innerHTML = `<div class="${dotCls}"></div><div class="session-info"><div class="session-name">${s.name}</div><div class="session-time">${String(s.h).padStart(2,'0')}:${String(s.m).padStart(2,'0')} ${cfg.label}</div></div><div class="session-remain">${rem}</div>${badge}`;
        list.appendChild(card);
      }
    }

    // 次回セッションの音声を確実にスケジュール
    scheduleAudioForNextEvent();
  } else {
    document.getElementById('event-name').textContent = '本日のセッション終了';
    cd.textContent = '--:--'; cd.className = 'countdown'; seki.innerHTML = '';
    dot.className = 'dot'; stxt.textContent = '終了';
    cancelScheduledAudio();
  }
}

update();
setInterval(() => {
  if (testMode && fakeNowSec !== null) {
    fakeNowSec++;
    const s = MARKETS[market].sessions[testSessionIndex];
    const targetSec = s.h * 3600 + s.m * 60;
    const remaining = targetSec - fakeNowSec;
    document.getElementById('test-count').textContent =
      remaining > 0 ? `残り ${remaining} 秒` : remaining === 0 ? 'オープン / クローズ！' : '次サイクルへ…';
    if (fakeNowSec > targetSec + 3) {
      lastSpoken = -1;
      testRunId++;
      s.fired = false;
      fakeNowSec = targetSec - testLeadSec;
      document.getElementById('test-count').textContent = s.name;
      cancelScheduledAudio();
      scheduleAudioForNextEvent();
    }
  }
  update();
}, 1000);

// --- 長押しトリガー ---
function addLongPress(el, ms, fn) {
  let timer = null, startX, startY;
  const start = (x, y) => { startX = x; startY = y; timer = setTimeout(() => { timer = null; fn(); }, ms); };
  const cancel = () => { clearTimeout(timer); timer = null; };
  el.addEventListener('mousedown', e => start(e.clientX, e.clientY));
  el.addEventListener('touchstart', e => { e.preventDefault(); start(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
  el.addEventListener('mousemove', e => { if (timer && (Math.abs(e.clientX-startX)>10||Math.abs(e.clientY-startY)>10)) cancel(); });
  el.addEventListener('touchmove', e => { if (timer && (Math.abs(e.touches[0].clientX-startX)>10||Math.abs(e.touches[0].clientY-startY)>10)) cancel(); });
  el.addEventListener('mouseup', cancel); el.addEventListener('mouseleave', cancel);
  el.addEventListener('touchend', cancel); el.addEventListener('touchcancel', cancel);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
addLongPress(document.getElementById('trigger-test'), 800, () => { testMode ? toggleTest() : startTest(); });
addLongPress(document.getElementById('trigger-log'), 800, () => {
  const p = document.getElementById('log-panel');
  p.style.display = p.style.display !== 'none' ? 'none' : 'block';
});
window.addEventListener('keydown', e => {
  if (!e.shiftKey) return;
  if (e.key === 'T') { testMode ? toggleTest() : startTest(); }
  else if (e.key === 'L') {
    const p = document.getElementById('log-panel');
    if (p.style.display !== 'none') downloadLog(); else p.style.display = 'block';
  }
});
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

// ==== フィードバック送信 (Issue #3 PoC) ====
// 本番Cloudflare Account作成後、ここを本番Worker URLに差し替える。
// (window.MARUN_FEEDBACK_API_BASE_URL をページ側で先に設定しておけば、
//  このファイルを直接書き換えずに向き先を切り替えられる)
const FEEDBACK_API_BASE_URL = window.MARUN_FEEDBACK_API_BASE_URL || 'http://localhost:8787';
const FEEDBACK_PRODUCT_ID = 'byo-yomi-stock-countdown';
const FEEDBACK_PRODUCT_NAME = '株式秒読みカウントダウン';
const FEEDBACK_SCHEMA_VERSION = 1;

let feedbackType = 'problem';

function detectOsName() {
  const ua = navigator.userAgent || '';
  if (/Android/i.test(ua)) return 'Android';
  if (/iPhone|iPad|iPod/i.test(ua)) return 'iOS';
  if (/Windows/i.test(ua)) return 'Windows';
  if (/Mac OS X/i.test(ua)) return 'macOS';
  if (/Linux/i.test(ua)) return 'Linux';
  return 'Unknown';
}

function detectOsVersion() {
  // ブラウザからは正確なOSバージョンを常に取得できるとは限らないため、
  // 取得できない場合は 'unknown' とする(ファイルパス等の詮索は行わない)。
  const ua = navigator.userAgent || '';
  const m = ua.match(/(?:Android|Windows NT|Mac OS X|CPU OS|CPU iPhone OS) ([\d._]+)/i);
  return m ? m[1].replace(/_/g, '.') : 'unknown';
}

function detectArchitecture() {
  // ブラウザから正確なCPUアーキテクチャは取得できないため簡易判定に留める。
  return (navigator.userAgentData && navigator.userAgentData.mobile) ? 'web-mobile' : 'web';
}

function buildFeedbackPayload(message) {
  return {
    reportType: feedbackType,
    productId: FEEDBACK_PRODUCT_ID,
    productName: FEEDBACK_PRODUCT_NAME,
    appVersion: window._androidAppVersion || APP_VERSION,
    osName: detectOsName(),
    osVersion: detectOsVersion(),
    architecture: detectArchitecture(),
    message: message,
    occurredAt: new Date().toISOString(),
    diagnostics: {
      locale: navigator.language || 'unknown',
      market: market,
      isStandalone: window.matchMedia && window.matchMedia('(display-mode: standalone)').matches,
    },
    schemaVersion: FEEDBACK_SCHEMA_VERSION,
  };
}

function selectFeedbackType(type) {
  feedbackType = type;
  document.getElementById('feedback-type-problem').classList.toggle('active', type === 'problem');
  document.getElementById('feedback-type-suggestion').classList.toggle('active', type === 'suggestion');
  updateFeedbackEnvPreview();
}

function updateFeedbackEnvPreview() {
  const msgEl = document.getElementById('feedback-message');
  const payload = buildFeedbackPayload(msgEl ? (msgEl.value || '(未入力)') : '(未入力)');
  const previewEl = document.getElementById('feedback-env-preview');
  if (previewEl) previewEl.textContent = JSON.stringify(payload, null, 2);
}

function openFeedbackModal() {
  document.getElementById('feedback-overlay').classList.remove('hidden');
  document.getElementById('feedback-status').textContent = '';
  document.getElementById('feedback-status').className = 'feedback-status';
  updateFeedbackEnvPreview();
}

function closeFeedbackModal() {
  document.getElementById('feedback-overlay').classList.add('hidden');
}

async function submitFeedback() {
  const messageEl = document.getElementById('feedback-message');
  const message = messageEl.value.trim();
  const statusEl = document.getElementById('feedback-status');
  const submitBtn = document.getElementById('feedback-submit');

  if (!message) {
    statusEl.textContent = '内容を入力してください。';
    statusEl.className = 'feedback-status error';
    return;
  }

  submitBtn.disabled = true;
  statusEl.textContent = '送信中...';
  statusEl.className = 'feedback-status';

  const payload = buildFeedbackPayload(message);

  try {
    const res = await fetch(`${FEEDBACK_API_BASE_URL}/api/v1/reports`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => null);

    if (res.ok && data && data.status === 'ok') {
      statusEl.textContent = '送信しました。ありがとうございます！';
      statusEl.className = 'feedback-status success';
      messageEl.value = '';
      setTimeout(closeFeedbackModal, 1800);
    } else {
      const errMsg = (data && data.error && data.error.message) || `送信に失敗しました (HTTP ${res.status})`;
      statusEl.textContent = errMsg;
      statusEl.className = 'feedback-status error';
    }
  } catch (e) {
    statusEl.textContent = '通信エラーが発生しました。時間をおいて再度お試しください。';
    statusEl.className = 'feedback-status error';
  } finally {
    submitBtn.disabled = false;
  }
}

document.getElementById('feedback-message')?.addEventListener('input', updateFeedbackEnvPreview);
